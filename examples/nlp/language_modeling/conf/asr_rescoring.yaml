# Config file for training left-to-right Transformer language model
name: &name TransformerLM

trainer:
  gpus: 4 # the number of gpus, 0 for CPU
  num_nodes: 1
  max_steps: 500000 # precedence over max_epochs
  accumulate_grad_batches: 1 # accumulates grads every k batches
  amp_level: O2 # O1/O2 for mixed precision
  precision: 16 # Should be set to 16 for O1 and O2, default is 16 as PT ignores it when am_level is O0
  accelerator: ddp
  checkpoint_callback: False  # Provided by exp_manager
  logger: False  # Provided by exp_manager
  log_every_n_steps: 1  # Interval of logging.
  val_check_interval: 0.05  # Set to 0.25 to check 4 times per epoch, or an int for number of iterations
  resume_from_checkpoint: null # The path to a checkpoint file to continue the training, restores the whole state including the epoch, step, LR schedulers, apex, etc.

model:

  language_model:
    tokenizer: word
    special_tokens:
        unk_token: '<UNK>'
        pad_token: '<PAD>'
        bos_token: '<BOS>'
        eos_token: '<EOS>'
    vocab_file: null
    tokenizer_model: null
    hidden_size: 512
    num_layers: 16
    num_attn_heads: 8
    inner_size: 2048
    max_seq_length: 128
    embedding_dropout: 0.1
    ffn_dropout: 0.1
    attn_score_dropout: 0.1
    attn_layer_dropout: 0.1

  dataset:
    max_seq_length: 128
    num_workers: 1 # number of workers for data loaders
    drop_last: false # drops the last last batch if it is smaller than the batch size
    pin_memory: false # enables pin_memory feature of the data loaders
    predict_last_k: 0 # number of last tokens to predict on evaluation
    
    # asr re-scoring specific parameters
    beam_size: 128 # size of the candidates beam
    coef_range: [0, 3] # search range for LM fusion coefficients
    coef_steps: 1000 # fineness of LM fusion coefficients search

  train_ds:
    file_name: null # path to train.txt for standard dataset / path to metadata.json for tarred dataset
    batch_size: 128
    shuffle: true
    num_samples: -1 # number of samples to be considered, -1 means all the dataset

    # tarred dataset specific parameters
    is_tarred: true
    tarred_text_filepaths: null # multi-path to all tars, e.g. /raid/tarred_dataset/text__OP_0..63_CL_.tar
    shuffle_n: 64

  validation_ds:
    file_name: null # path to file with validation data
    batch_size: 128
    shuffle: false
    num_samples: -1 # number of samples to be considered, -1 means all the dataset

  optim:
    name: novograd
    lr: 0.01
    betas: [0.95, 0.25]
    weight_decay: 0

    sched:
      name: CosineAnnealing
      warmup_steps: null
      warmup_ratio: 0.05
      last_epoch: -1

      # pytorch lightning args
      monitor: val_loss
      reduce_on_plateau: false

exp_manager:
  exp_dir: null  # where to store logs and checkpoints
  name: *name  # name of experiment
  create_tensorboard_logger: True
  create_checkpoint_callback: True

hydra:
  run:
    dir: .
  job_logging:
    root:
      handlers: null
